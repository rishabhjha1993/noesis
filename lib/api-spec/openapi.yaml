openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analysis
    description: Noesis visual analysis
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /analyze:
    post:
      operationId: analyzeImage
      tags: [analysis]
      summary: Analyze an uploaded visual
      description:
        Sends an uploaded image to the multimodal model and returns a
        structured NoesisAnalysis walkthrough for the visual.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisRequest"
      responses:
        "200":
          description: Structured analysis of the uploaded visual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoesisAnalysis"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Upstream analysis failed or returned an invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    AnalysisRequest:
      type: object
      description: Image payload for analysis
      required:
        - image
        - mediaType
      properties:
        image:
          type: string
          description: Base64-encoded image bytes (no data-URL prefix)
        mediaType:
          type: string
          enum: ["image/png", "image/jpeg", "image/webp"]
          description: MIME type of the uploaded image
    NoesisRegion:
      type: object
      description:
        One explanatory region of the visual. Coordinates are normalized
        0-1 relative to the whole image; x + width and y + height must not
        exceed 1.
      required:
        - id
        - label
        - x
        - y
        - width
        - height
        - sequence_order
        - explanation
        - why_it_matters
        - related_region_ids
        - relationship_explanation
        - confidence
      properties:
        id:
          type: string
        label:
          type: string
        x:
          type: number
          minimum: 0
          maximum: 1
        y:
          type: number
          minimum: 0
          maximum: 1
        width:
          type: number
          minimum: 0
          maximum: 1
        height:
          type: number
          minimum: 0
          maximum: 1
        sequence_order:
          type: number
          minimum: 1
        explanation:
          type: string
        why_it_matters:
          type: string
        related_region_ids:
          type: array
          items:
            type: string
        relationship_explanation:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
    NoesisAnalysis:
      type: object
      required:
        - title
        - image_type
        - central_question
        - overall_summary
        - big_takeaway
        - regions
      properties:
        title:
          type: string
        image_type:
          type: string
        central_question:
          type: string
        overall_summary:
          type: string
        big_takeaway:
          type: string
        regions:
          type: array
          minItems: 4
          maxItems: 6
          items:
            $ref: "#/components/schemas/NoesisRegion"
